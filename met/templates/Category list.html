{% extends "base.html" %}
{% block title %}Категории{% endblock %}
{% block content %}
<h2>Категории металла</h2>
<ul>
    {% for c in categories %}
        <li><strong>{{ c.title }}</strong> — {{ c.description }}</li>
    {% empty %}
        <li>Категорий пока нет.</li>
    {% endfor %}
</ul>
<a href="{% url 'category_create' %}" class="btn">Добавить категорию</a>
{% endblock %}
